packages:
  - apps/*
  - packages/*

# Dependency install scripts pnpm may run. esbuild's swaps its JS shim for the
# native binary (celld deploy runs it); the others are no-ops or version notices.
allowBuilds:
  esbuild: true
  '@google/genai': false
  protobufjs: false

patchedDependencies:
  '@earendil-works/pi-ai@1.3.0': apps/worker/patches/@earendil-works__pi-ai@1.3.0.patch
