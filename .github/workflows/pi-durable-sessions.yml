name: pi-durable-sessions

on:
  pull_request:
    paths: ["pi-durable-sessions/**", ".github/workflows/pi-durable-sessions.yml"]
  push:
    branches: [main, pi-durable-sessions]
    paths: ["pi-durable-sessions/**", ".github/workflows/pi-durable-sessions.yml"]

concurrency:
  group: pi-durable-sessions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pi-durable-sessions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The version package.json pins; shellcheck is already on the runner.
      - run: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pi-durable-sessions/ui exec playwright install --with-deps chromium
      - run: pnpm check
